<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Sea</title>
  <meta name="description" content="Pantalla de inicio del juego Sky & Sea.">

  <!-- CSS -->
  <link rel="stylesheet" href="/frontend/css/main.css">

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Phaser 3 para animaciones laterales -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>

<body>
  <!-- Fondo de la pantalla de inicio -->
  <div class="fondo">
    <img src="/frontend/Imagenes/Fondo/FondoPantallaDeInicio.jpg" alt="Fondo">
  </div>

  <!-- Encabezado con logotipo principal -->
  <header>
    <div class="titulo">
      <img src="/frontend/Imagenes/Logo/LetrasSinfondo.png" alt="Logo Sky & Sea">
    </div>
  </header>

  <main>
    <!-- Menú principal de navegación -->
    <div class="menu-container">
      <div class="menu-box">
        <img src="/frontend/Imagenes/Logo/SoloImagenSinFondo.png" alt="Logo" class="menu-icon">
        <div class="menu-buttons">
          <button id="btnStart" class="game-btn" style="margin-top: 10px;">INICIO</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página reservado -->
  <footer class="footer"></footer>

  <!-- Modal para ingresar nombre de usuario antes de comenzar -->
  <div id="modalNombre" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p class="modal-titulo">INGRESA TU USUARIO</p>
      <input 
        id="inputNombre" 
        type="text" 
        class="input-nombre" 
        placeholder="Usuario" 
        maxlength="30"
        autocomplete="off">
      <div class="modal-actions">
        <button id="aceptarNombre" class="game-btn">Aceptar</button>
        <button id="cancelarNombre" class="game-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="modalModoInicio" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-modo-inicio">
      <p class="modal-titulo">¿CÓMO QUIERES JUGAR?</p>
      <div class="modal-actions modal-actions-columna">
        <button id="btnPartidaNueva" class="game-btn" type="button">PARTIDA NUEVA</button>
        <button id="btnReanudarPartida" class="game-btn" type="button">REANUDAR PARTIDA</button>
      </div>
      <div class="modal-actions">
        <button id="cancelarModoInicio" class="game-btn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="modalPartidasReanudables" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-reanudar">
      <p class="modal-titulo">PARTIDAS REANUDABLES</p>
      <div id="listaPartidasReanudables" class="lista-reanudables"></div>
      <div class="modal-actions">
        <button id="volverModoInicio" class="game-btn" type="button">Volver</button>
        <button id="cancelarReanudacion" class="game-btn" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal para seleccionar equipo -->
  <div id="modalEquipo" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-equipo">
      <p class="modal-titulo">ELIGE TU EQUIPO</p>
      <div class="equipos-container">
        <div class="equipo-opcion">
          <p class="nombre-equipo">Porta Naval</p>
          <button id="btnPortaNaval" class="btn-equipo">
            <img src="/frontend/Imagenes/DronNaval/DronMisil.png" alt="Porta Naval - Dron Misil">
          </button>
        </div>
        <div class="equipo-opcion">
          <p class="nombre-equipo">Porta Aéreo</p>
          <button id="btnPortaAereo" class="btn-equipo">
            <img src="/frontend/Imagenes/DronAereo/DronAereo.png" alt="Porta Aéreo - Dron Aéreo">
          </button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelarEquipo" class="game-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal para seleccionar estrategia Porta Naval -->
  <div id="modalEstrategiaNaval" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-estrategia">
      <p class="modal-titulo">SELECCIONA TU ESTRATEGIA</p>
      <p class="cronometro-plantilla"><span id="timerNaval">15</span></p>
      <div class="estrategias-container">
        <button id="btnEstratNameNaval1" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Naval1.jpg" alt="Estrategia Naval 1">
        </button>
        <button id="btnEstratNameNaval2" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Naval2.jpg" alt="Estrategia Naval 2">
        </button>
        <button id="btnEstratNameNaval3" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Naval3.jpg" alt="Estrategia Naval 3">
        </button>
      </div>
      <div class="modal-actions">
        <button id="cancelarEstrategiaNaval" class="game-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal para seleccionar estrategia Porta Aéreo -->
  <div id="modalEstrategiaAereo" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-estrategia">
      <p class="modal-titulo">SELECCIONA TU ESTRATEGIA</p>
      <p class="cronometro-plantilla"><span id="timerAereo">15</span></p>
      <div class="estrategias-container">
        <button id="btnEstratNameAereo1" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Aereo1.jpg" alt="Estrategia Aéreo 1">
        </button>
        <button id="btnEstratNameAereo2" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Aereo2.jpg" alt="Estrategia Aéreo 2">
        </button>
        <button id="btnEstratNameAereo3" class="btn-estrategia">
          <img src="/frontend/Imagenes/Plantillas/Aereo3.jpg" alt="Estrategia Aéreo 3">
        </button>
      </div>
      <div class="modal-actions">
        <button id="cancelarEstrategiaAereo" class="game-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="errorModal" class="modal-overlay error" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box error-box">
      <p class="error-title">ERROR:</p>
      <p id="errorMessage" class="error-message"></p>
      <div class="modal-actions">
        <button id="errorOk" class="game-btn error-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (window.location.protocol === 'file:')
      ? 'http://localhost:8080'
      : '';
    const API = `${API_BASE}/api/game`;

    const FRIENDLY_ERROR_BY_CODE = {
      ACCION_YA_REALIZADA: 'La acción ya fue realizada en este turno.',
      OCUPADO: 'Ya hay dos jugadores en partida. Esperá a que finalice para ingresar.',
      NOMBRE_INVALIDO: 'El nombre ingresado no es válido. Usá al menos 3 caracteres sin símbolos.',
      USUARIO_EN_PARTIDA_ACTIVA: 'Este usuario ya esta en una partida, ingrese a reanudar partida',
      ESPERANDO_SELECCION_EQUIPO: 'El primer jugador está eligiendo equipo. Intentá de nuevo en unos segundos.',
      DEBE_UNIRSE_PARTIDA_ACTIVA: 'Hay una partida activa esperando rival. Debes ingresar a esa partida.',
      EQUIPO_INVALIDO: 'El equipo seleccionado no es válido. Elegí Naval o Aéreo.',
      PARTIDA_NO_ENCONTRADA: 'No se encontró la partida seleccionada.',
      PARTIDA_NO_REANUDABLE: 'La partida seleccionada ya no es reanudable.',
      PLAYER_NO_ENCONTRADO: 'No se encontró tu jugador en la partida actual.',
      HTTP_404: 'No se encontró el recurso solicitado en el servidor.',
      HTTP_500: 'El servidor tuvo un problema interno al procesar la acción.',
      HTTP_503: 'El servidor está temporalmente no disponible. Intentá nuevamente en unos segundos.'
    };

    function normalizeErrorInput(input) {
      const text = String(input ?? '').trim();
      if (!text) return 'Ocurrió un error inesperado. Intentá nuevamente.';
      return text;
    }

    function findErrorCode(text) {
      const matches = text.toUpperCase().match(/[A-Z][A-Z0-9_]{2,}/g);
      if (!matches) return null;
      return matches.find((token) => FRIENDLY_ERROR_BY_CODE[token]) ?? null;
    }

    function toFriendlyErrorMessage(input) {
      const text = normalizeErrorInput(input);
      const code = findErrorCode(text);
      if (code) {
        const normalized = text.toUpperCase();
        if (code === 'ACCION_YA_REALIZADA') {
          if (normalized.includes('NO SE PUEDE MOVER')) return 'No se puede mover: acción ya realizada.';
          if (normalized.includes('NO SE PUEDE DISPARAR')) return 'No se puede disparar: acción ya realizada.';
          return 'La acción ya fue realizada en este turno.';
        }
        return FRIENDLY_ERROR_BY_CODE[code];
      }

      const normalized = text.toUpperCase();
      if (
        normalized.includes('FAILED TO FETCH')
        || normalized.includes('NETWORK')
        || normalized.includes('NO SE PUDO CONECTAR CON EL SERVIDOR')
      ) {
        return 'Se cayó el servidor';
      }
      if (normalized.includes('RESPUESTA NO VÁLIDA DEL SERVIDOR')) {
        return 'El servidor devolvió una respuesta inválida. Intentá nuevamente.';
      }

      return text;
    }

    function hideError() {
      const modal = document.getElementById('errorModal');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'true');
      modal.classList.remove('activo');
    }

    function showError(message) {
      const modal = document.getElementById('errorModal');
      const messageNode = document.getElementById('errorMessage');
      if (!modal || !messageNode) {
        console.error('ERROR:', message);
        return;
      }

      messageNode.textContent = toFriendlyErrorMessage(message);
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('activo');

      const ok = document.getElementById('errorOk');
      if (ok) ok.focus();
    }

    window.alert = (message) => showError(message);

    async function apiRequest(path, method = 'GET') {
      const response = await fetch(`${API}${path}`, { method });
      const raw = await response.text();
      let data = null;

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error(`Respuesta no válida del servidor (HTTP ${response.status})`);
        }
      }

      if (!response.ok) {
        throw new Error(data?.error || `HTTP_${response.status}`);
      }

      if (data?.error) {
        throw new Error(data.error);
      }

      return data || {};
    }

    function getSessionValue(key) {
      const fromSession = sessionStorage.getItem(key);
      if (fromSession !== null) {
        return fromSession;
      }
      const legacyValue = localStorage.getItem(key);
      if (legacyValue !== null) {
        sessionStorage.setItem(key, legacyValue);
        localStorage.removeItem(key);
      }
      return legacyValue;
    }

    function setSessionValue(key, value) {
      sessionStorage.setItem(key, value);
      localStorage.removeItem(key);
    }

    function removeSessionValue(key) {
      sessionStorage.removeItem(key);
      localStorage.removeItem(key);
    }

    function clearSession() {
      removeSessionValue('playerId');
      removeSessionValue('idPartida');
      removeSessionValue('equipoAsignado');
      removeSessionValue('equipoSeleccionado');
      removeSessionValue('estrategiaSeleccionada');
      removeSessionValue('numeroJugador');
      removeSessionValue('nombreUsuario');
      removeSessionValue('origenReanudacion');
    }

    let nombrePendiente = '';
    let estrategiaTimerId = null;
    let estrategiaSegundosRestantes = 15;
    let estrategiaModalActivo = null;
    const errorModal = document.getElementById('errorModal');
    const errorOk = document.getElementById('errorOk');

    if (errorOk) {
      errorOk.addEventListener('click', hideError);
    }
    if (errorModal) {
      errorModal.addEventListener('click', (event) => {
        if (event.target === errorModal) {
          hideError();
        }
      });
    }
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && errorModal?.getAttribute('aria-hidden') === 'false') {
        hideError();
      }
    });

    function navegarConEstrategia(estrategia) {
      if (!getSessionValue('playerId')) {
        alert('Primero debes registrarte en la partida.');
        return;
      }
      setSessionValue('estrategiaSeleccionada', estrategia);
      window.location.href = '/frontend/Paginas/start.html';
    }

    function detenerTimerEstrategia() {
      if (estrategiaTimerId) {
        clearInterval(estrategiaTimerId);
        estrategiaTimerId = null;
      }
      estrategiaSegundosRestantes = 15;
      const timerNaval = document.getElementById('timerNaval');
      const timerAereo = document.getElementById('timerAereo');
      if (timerNaval) timerNaval.textContent = '15';
      if (timerAereo) timerAereo.textContent = '15';
      estrategiaModalActivo = null;
    }

    function iniciarTimerEstrategia(tipo) {
      detenerTimerEstrategia();
      estrategiaModalActivo = tipo;
      estrategiaSegundosRestantes = 15;

      const timerElemento = tipo === 'NAVAL'
        ? document.getElementById('timerNaval')
        : document.getElementById('timerAereo');

      if (!timerElemento) return;

      timerElemento.textContent = String(estrategiaSegundosRestantes);
      estrategiaTimerId = setInterval(() => {
        estrategiaSegundosRestantes -= 1;
        timerElemento.textContent = String(Math.max(estrategiaSegundosRestantes, 0));

        if (estrategiaSegundosRestantes <= 0) {
          detenerTimerEstrategia();
          if (tipo === 'NAVAL') {
            navegarConEstrategia('Naval1');
          } else {
            navegarConEstrategia('Aereo1');
          }
        }
      }, 1000);
    }

    function abrirModalEstrategia(tipo) {
      if (tipo === 'NAVAL') {
        modalEstrategiaNaval.setAttribute('aria-hidden', 'false');
        modalEstrategiaNaval.classList.add('activo');
      } else {
        modalEstrategiaAereo.setAttribute('aria-hidden', 'false');
        modalEstrategiaAereo.classList.add('activo');
      }
      iniciarTimerEstrategia(tipo);
    }

    // ====== LÓGICA DEL MODAL DE INGRESO DE NOMBRE ======
    const btnStart = document.getElementById('btnStart');
    const modalNombre = document.getElementById('modalNombre');
    const modalNombreBox = modalNombre ? modalNombre.querySelector('.modal-box') : null;
    const inputNombre = document.getElementById('inputNombre');
    const aceptarNombre = document.getElementById('aceptarNombre');
    const cancelarNombre = document.getElementById('cancelarNombre');
    const modalModoInicio = document.getElementById('modalModoInicio');
    const btnPartidaNueva = document.getElementById('btnPartidaNueva');
    const btnReanudarPartida = document.getElementById('btnReanudarPartida');
    const cancelarModoInicio = document.getElementById('cancelarModoInicio');
    const modalPartidasReanudables = document.getElementById('modalPartidasReanudables');
    const listaPartidasReanudables = document.getElementById('listaPartidasReanudables');
    const volverModoInicio = document.getElementById('volverModoInicio');
    const cancelarReanudacion = document.getElementById('cancelarReanudacion');

    function cerrarModalModoInicio() {
      if (!modalModoInicio) return;
      modalModoInicio.setAttribute('aria-hidden', 'true');
      modalModoInicio.classList.remove('activo');
    }

    function abrirModalModoInicio() {
      if (!modalModoInicio) return;
      modalModoInicio.setAttribute('aria-hidden', 'false');
      modalModoInicio.classList.add('activo');
    }

    function cerrarModalPartidasReanudables() {
      if (!modalPartidasReanudables) return;
      modalPartidasReanudables.setAttribute('aria-hidden', 'true');
      modalPartidasReanudables.classList.remove('activo');
      if (listaPartidasReanudables) {
        listaPartidasReanudables.innerHTML = '';
      }
    }

    function abrirModalPartidasReanudables() {
      if (!modalPartidasReanudables) return;
      modalPartidasReanudables.setAttribute('aria-hidden', 'false');
      modalPartidasReanudables.classList.add('activo');
    }

    function volverAModalNombreParaReintento() {
      cerrarModalPartidasReanudables();
      cerrarModalModoInicio();
      if (modalEquipo) {
        modalEquipo.setAttribute('aria-hidden', 'true');
        modalEquipo.classList.remove('activo');
      }

      nombrePendiente = '';
      if (modalNombre) {
        modalNombre.setAttribute('aria-hidden', 'false');
        modalNombre.classList.add('activo');
      }
      if (inputNombre) {
        inputNombre.value = '';
        inputNombre.focus();
      }
    }

    async function iniciarPartidaNueva() {
      const nombre = nombrePendiente;
      if (!nombre) {
        alert('Primero ingresa tu nombre.');
        return;
      }

      const join = await apiRequest(`/join?nombre=${encodeURIComponent(nombre)}`, 'POST');

      if (join.estadoPartida === 'OCUPADO') {
        alert('Ya hay dos jugadores jugando. Debes esperar a que termine la partida.');
        return;
      }

      if (join.estadoPartida === 'NECESITA_EQUIPO') {
        setSessionValue('origenReanudacion', '0');
        cerrarModalModoInicio();
        modalEquipo.setAttribute('aria-hidden', 'false');
        modalEquipo.classList.add('activo');
        return;
      }

      if (join.estadoPartida === 'ESPERANDO_SELECCION_EQUIPO') {
        alert('ESPERANDO_SELECCION_EQUIPO');
        nombrePendiente = '';
        return;
      }

      if (join.estadoPartida === 'NOMBRE_INVALIDO') {
        alert('El nombre ingresado no es válido.');
        return;
      }

      if (join.estadoPartida === 'USUARIO_EN_PARTIDA_ACTIVA') {
        alert('USUARIO_EN_PARTIDA_ACTIVA');
        volverAModalNombreParaReintento();
        return;
      }

      setSessionValue('origenReanudacion', '0');
      setSessionValue('nombreUsuario', join.nombre || nombre);
      setSessionValue('playerId', join.playerId || '');
      setSessionValue('idPartida', join.idPartida || '');
      setSessionValue('equipoAsignado', join.equipo || '');
      setSessionValue('equipoSeleccionado', join.equipo || '');
      if (join.numeroJugador === 1 || join.numeroJugador === 2) {
        setSessionValue('numeroJugador', String(join.numeroJugador));
      }

      nombrePendiente = '';
      cerrarModalModoInicio();

      if (join.equipo === 'NAVAL') {
        abrirModalEstrategia('NAVAL');
      } else {
        abrirModalEstrategia('AEREO');
      }
    }

    async function cargarPartidasReanudables() {
      const nombre = nombrePendiente;
      if (!nombre) {
        alert('Primero ingresa tu nombre.');
        return;
      }

      const data = await apiRequest(`/resumableMatches?nombre=${encodeURIComponent(nombre)}`);
      const partidas = Array.isArray(data.partidas) ? data.partidas : [];

      if (!partidas.length) {
        alert('No hay partidas reanudables para este usuario.');
        return;
      }

      if (listaPartidasReanudables) {
        listaPartidasReanudables.innerHTML = '';
        partidas.forEach((p, index) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'item-reanudable';
          item.innerHTML = `
            <span>Partida ${index + 1}</span>
            <span>ID: ${p.idPartida}</span>
            <span>Estado: ${p.estadoPartida || '-'}</span>
            <span>Equipo: ${p.equipoJugador || '-'}</span>
            <span>Turno: ${p.turnoNumero ?? '-'}</span>
          `;
          item.addEventListener('click', async () => {
            try {
              const resume = await apiRequest(
                `/resume?nombre=${encodeURIComponent(nombre)}&idPartida=${encodeURIComponent(p.idPartida)}`,
                'POST'
              );
              if (!resume.ok) {
                alert(resume.estado || 'No se pudo reanudar la partida.');
                return;
              }

              setSessionValue('origenReanudacion', '1');
              setSessionValue('nombreUsuario', resume.nombre || nombre);
              setSessionValue('playerId', resume.playerId || '');
              setSessionValue('idPartida', resume.idPartida || '');
              setSessionValue('equipoAsignado', resume.equipo || '');
              setSessionValue('equipoSeleccionado', resume.equipo || '');
              if (resume.numeroJugador === 1 || resume.numeroJugador === 2) {
                setSessionValue('numeroJugador', String(resume.numeroJugador));
              }

              nombrePendiente = '';
              cerrarModalPartidasReanudables();
              cerrarModalModoInicio();
              window.location.href = '/frontend/Paginas/start.html';
            } catch (error) {
              alert(`No se pudo reanudar la partida: ${error.message}`);
            }
          });
          listaPartidasReanudables.appendChild(item);
        });
      }

      cerrarModalModoInicio();
      abrirModalPartidasReanudables();
    }

    async function tienePartidasReanudables(nombre) {
      const data = await apiRequest(`/resumableMatches?nombre=${encodeURIComponent(nombre)}`);
      const partidas = Array.isArray(data.partidas) ? data.partidas : [];
      return partidas.length > 0;
    }

    // Verificar que todos los elementos existan antes de inicializar
    if (btnStart && modalNombre && inputNombre && aceptarNombre && cancelarNombre) {
      btnStart.addEventListener('click', function () {
        modalNombre.setAttribute('aria-hidden', 'false');
        modalNombre.classList.add('activo');
        inputNombre.disabled = false;
        inputNombre.readOnly = false;
        requestAnimationFrame(() => {
          inputNombre.focus();
        });
      });

      if (modalNombreBox) {
        modalNombreBox.addEventListener('click', (evento) => {
          evento.stopPropagation();
        });
      }

      // Cerrar el modal de nombre sin guardar
      function cerrarModalNombre() {
        modalNombre.setAttribute('aria-hidden', 'true');
        modalNombre.classList.remove('activo');
        inputNombre.value = '';
      }

      // Cerrar el modal al pulsar cancelar
      cancelarNombre.addEventListener('click', cerrarModalNombre);

      // Cerrar el modal al hacer clic fuera de la caja
      modalNombre.addEventListener('click', (evento) => {
        if (evento.target === modalNombre) {
          cerrarModalNombre();
        }
      });

      // Cerrar el modal con la tecla Escape
      document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && modalNombre.getAttribute('aria-hidden') === 'false') {
          cerrarModalNombre();
        }
      });

      // Enviar el nombre y registra jugador en backend
      aceptarNombre.addEventListener('click', async () => {
        const nombre = inputNombre.value.trim();
        if (!nombreValido(nombre)) {
          alert('El nombre debe ser único, mínimo 3 caracteres, sin espacios ni símbolos especiales.');
          inputNombre.focus();
          return;
        }

        aceptarNombre.disabled = true;
        try {
          nombrePendiente = nombre;
          cerrarModalNombre();

          const hayPartidasReanudables = await tienePartidasReanudables(nombre);
          if (hayPartidasReanudables) {
            abrirModalModoInicio();
          } else {
            await iniciarPartidaNueva();
          }
        } catch (error) {
          alert(`No se pudo conectar con el servidor: ${error.message}`);
        } finally {
          aceptarNombre.disabled = false;
        }
      });

      // Permitir enviar el nombre con Enter
      inputNombre.addEventListener('keydown', (evento) => {
        if (evento.key === 'Enter') {
          aceptarNombre.click();
        }
      });

      if (btnPartidaNueva) {
        btnPartidaNueva.addEventListener('click', async () => {
          try {
            btnPartidaNueva.disabled = true;
            await iniciarPartidaNueva();
          } catch (error) {
            alert(`No se pudo iniciar partida nueva: ${error.message}`);
          } finally {
            btnPartidaNueva.disabled = false;
          }
        });
      }

      if (btnReanudarPartida) {
        btnReanudarPartida.addEventListener('click', async () => {
          try {
            btnReanudarPartida.disabled = true;
            await cargarPartidasReanudables();
          } catch (error) {
            alert(`No se pudo cargar partidas reanudables: ${error.message}`);
          } finally {
            btnReanudarPartida.disabled = false;
          }
        });
      }

      if (cancelarModoInicio) {
        cancelarModoInicio.addEventListener('click', () => {
          cerrarModalModoInicio();
          nombrePendiente = '';
        });
      }

      if (volverModoInicio) {
        volverModoInicio.addEventListener('click', () => {
          cerrarModalPartidasReanudables();
          abrirModalModoInicio();
        });
      }

      if (cancelarReanudacion) {
        cancelarReanudacion.addEventListener('click', () => {
          cerrarModalPartidasReanudables();
          nombrePendiente = '';
        });
      }
    }

    // ====== LÓGICA DEL MODAL DE SELECCIÓN DE EQUIPO ======
    const modalEquipo = document.getElementById('modalEquipo');
    const btnPortaNaval = document.getElementById('btnPortaNaval');
    const btnPortaAereo = document.getElementById('btnPortaAereo');
    const cancelarEquipo = document.getElementById('cancelarEquipo');

    // Verifica que todos los elementos existan antes de inicializar
    if (modalEquipo && btnPortaNaval && btnPortaAereo && cancelarEquipo) {
      async function registrarConEquipo(equipo) {
        if (!nombrePendiente) {
          alert('Primero ingresa tu nombre.');
          modalEquipo.setAttribute('aria-hidden', 'true');
          modalEquipo.classList.remove('activo');
          modalNombre.setAttribute('aria-hidden', 'false');
          modalNombre.classList.add('activo');
          inputNombre.focus();
          return;
        }

        btnPortaNaval.disabled = true;
        btnPortaAereo.disabled = true;
        try {
          let join = await apiRequest(
            `/join?nombre=${encodeURIComponent(nombrePendiente)}&equipo=${encodeURIComponent(equipo)}`,
            'POST'
          );

          if (join.estadoPartida === 'OCUPADO') {
            alert('Ya hay dos jugadores jugando. Debes esperar a que termine la partida.');
            return;
          }

          if (join.estadoPartida === 'EQUIPO_INVALIDO') {
            alert('El equipo elegido no es válido.'); 
            return;
          }

          if (join.estadoPartida === 'USUARIO_EN_PARTIDA_ACTIVA') {
            alert('USUARIO_EN_PARTIDA_ACTIVA');
            volverAModalNombreParaReintento();
            return;
          }

          setSessionValue('nombreUsuario', join.nombre || nombrePendiente);
          setSessionValue('playerId', join.playerId || '');
          setSessionValue('idPartida', join.idPartida || '');
          setSessionValue('origenReanudacion', '0');
          setSessionValue('equipoAsignado', join.equipo || equipo);
          setSessionValue('equipoSeleccionado', join.equipo || equipo);
          if (join.numeroJugador === 1 || join.numeroJugador === 2) {
            setSessionValue('numeroJugador', String(join.numeroJugador));
          }

          nombrePendiente = '';
          cerrarModalEquipo();

          if (join.equipo === 'NAVAL') {
            abrirModalEstrategia('NAVAL');
          } else {
            abrirModalEstrategia('AEREO');
          }
        } catch (error) {
          alert(`No se pudo conectar con el servidor: ${error.message}`);
        } finally {
          btnPortaNaval.disabled = false;
          btnPortaAereo.disabled = false;
        }
      }

      // Cerrar el modal de equipo sin guardar
      function cerrarModalEquipo() {
        modalEquipo.setAttribute('aria-hidden', 'true');
        modalEquipo.classList.remove('activo');
      }

      // Cerrar el modal al pulsar cancelar
      cancelarEquipo.addEventListener('click', cerrarModalEquipo);

      // Cerrar el modal al hacer clic fuera de la caja
      modalEquipo.addEventListener('click', (evento) => {
        if (evento.target === modalEquipo) {
          cerrarModalEquipo();
        }
      });

      // Cerrar el modal con la tecla Escape
      document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && modalEquipo.getAttribute('aria-hidden') === 'false') {
          cerrarModalEquipo();
        }
      });

      // Seleccionar Porta Naval y abrir modal de estrategia
      btnPortaNaval.addEventListener('click', () => {
        registrarConEquipo('NAVAL');
      });

      // Seleccionar Porta Aéreo y abrir modal de estrategia
      btnPortaAereo.addEventListener('click', () => {
        registrarConEquipo('AEREO');
      });
    }

    // ====== LÓGICA DEL MODAL DE ESTRATEGIA PORTA NAVAL ======
    const modalEstrategiaNaval = document.getElementById('modalEstrategiaNaval');
    const btnEstratNaval1 = document.getElementById('btnEstratNameNaval1');
    const btnEstratNaval2 = document.getElementById('btnEstratNameNaval2');
    const btnEstratNaval3 = document.getElementById('btnEstratNameNaval3');
    const cancelarEstrategiaNaval = document.getElementById('cancelarEstrategiaNaval');

    if (modalEstrategiaNaval && btnEstratNaval1 && btnEstratNaval2 && btnEstratNaval3 && cancelarEstrategiaNaval) {
      function cerrarModalEstrategiaNaval() {
        detenerTimerEstrategia();
        modalEstrategiaNaval.setAttribute('aria-hidden', 'true');
        modalEstrategiaNaval.classList.remove('activo');
        modalEquipo.setAttribute('aria-hidden', 'false');
        modalEquipo.classList.add('activo');
      }

      cancelarEstrategiaNaval.addEventListener('click', cerrarModalEstrategiaNaval);

      modalEstrategiaNaval.addEventListener('click', (evento) => {
        if (evento.target === modalEstrategiaNaval) {
          cerrarModalEstrategiaNaval();
        }
      });

      document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && modalEstrategiaNaval.getAttribute('aria-hidden') === 'false') {
          cerrarModalEstrategiaNaval();
        }
      });

      // Seleccionar estrategia naval y navegar
      btnEstratNaval1.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Naval1');
      });

      btnEstratNaval2.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Naval2');
      });

      btnEstratNaval3.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Naval3');
      });
    }

    // ====== LÓGICA DEL MODAL DE ESTRATEGIA PORTA AÉREO ======
    const modalEstrategiaAereo = document.getElementById('modalEstrategiaAereo');
    const btnEstratAereo1 = document.getElementById('btnEstratNameAereo1');
    const btnEstratAereo2 = document.getElementById('btnEstratNameAereo2');
    const btnEstratAereo3 = document.getElementById('btnEstratNameAereo3');
    const cancelarEstrategiaAereo = document.getElementById('cancelarEstrategiaAereo');

    if (modalEstrategiaAereo && btnEstratAereo1 && btnEstratAereo2 && btnEstratAereo3 && cancelarEstrategiaAereo) {
      function cerrarModalEstrategiaAereo() {
        detenerTimerEstrategia();
        modalEstrategiaAereo.setAttribute('aria-hidden', 'true');
        modalEstrategiaAereo.classList.remove('activo');
        modalEquipo.setAttribute('aria-hidden', 'false');
        modalEquipo.classList.add('activo');
      }

      cancelarEstrategiaAereo.addEventListener('click', cerrarModalEstrategiaAereo);

      modalEstrategiaAereo.addEventListener('click', (evento) => {
        if (evento.target === modalEstrategiaAereo) {
          cerrarModalEstrategiaAereo();
        }
      });

      document.addEventListener('keydown', (evento) => {
        if (evento.key === 'Escape' && modalEstrategiaAereo.getAttribute('aria-hidden') === 'false') {
          cerrarModalEstrategiaAereo();
        }
      });

      // Seleccionar estrategia aérea y navegar
      btnEstratAereo1.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Aereo1');
      });

      btnEstratAereo2.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Aereo2');
      });

      btnEstratAereo3.addEventListener('click', () => {
        detenerTimerEstrategia();
        navegarConEstrategia('Aereo3');
      });
    }

    // Validar nombre único antes de enviar join
    function nombreValido(nombre) {
      // Solo letras, números y guiones, mínimo 3 caracteres
      return /^[a-zA-Z0-9\-]{3,}$/.test(nombre);
    }
  </script>

  <!-- Sistema de vista lateral de ataques con Phaser -->
  <script src="/frontend/js/lateral-attack.js"></script>
</body>
