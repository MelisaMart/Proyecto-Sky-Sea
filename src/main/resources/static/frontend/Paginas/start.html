<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Sea</title>
  <meta name="description" content="Pantalla de juego de Sky & Sea.">

  <!-- CSS -->
  <link rel="stylesheet" href="/frontend/css/main.css">

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body class="pagina-start">
  <!-- Fondo -->
  <div class="fondoStart">
    <img src="/frontend/Imagenes/Fondo/FondoVistaDeArriba.png" alt="Fondo de la partida">
  </div>

  <!-- Encabezado con logotipo -->
  <header>
    <div class="titulostart">
      <img src="/frontend/Imagenes/Logo/LetrasSinfondo.png" alt="Logo Sky & Sea">
    </div>
  </header>

  <!-- Contenido principal con la cuadrícula del juego -->
  <main>
    <div class="tablero-wrapper">
      <div class="tablero-header">
        <div class="tablero-info">
          <div id="indicadorJugador" class="indicador-jugador" aria-live="polite"></div>
          <div id="indicadorEsperaJugador2" class="indicador-espera" aria-live="polite"></div>
          <div id="indicadorTurno" class="indicador-turno" aria-live="polite"></div>
          <div id="cronometroTurno" class="cronometro-turno" aria-live="polite"></div>
        </div>
      </div>
      <div class="cuadricula" id="grid"></div>
      <div class="tablero-acciones">
        <button id="btnMover" class="game-btn boton-accion" type="button" disabled>MOVER</button>
        <button id="btnDisparar" class="game-btn boton-accion" type="button">DISPARAR</button>
        <button id="btnPlay" class="game-btn boton-play" type="button" aria-label="Play" title="Play"></button>
        <button id="btnAbandonar" class="game-btn boton-accion boton-abandonar" type="button">ABANDONAR</button>
      </div>
    </div>
  </main>

  <section class="hud-inferior" aria-live="polite">
    <div class="hud-bloque hud-tu-equipo">
      <div class="hud-encabezado">
        <div class="hud-titulo" id="hudTituloTuEquipo">TU EQUIPO</div>
        <div class="hud-subtitulo" id="hudTipoTuEquipo">-</div>
      </div>
      <div class="hud-metricas">
        <div class="hud-metrica">
          <img id="hudIconDronTu" class="hud-icono" src="/frontend/Imagenes/ContadorDeVidas/DronAereoTuEquipo.png" alt="Drones tu equipo">
          <span id="hudDronesTu" class="hud-valor">-</span>
        </div>
        <div class="hud-metrica">
          <img id="hudIconMunicionTu" class="hud-icono" src="/frontend/Imagenes/ContadorDeVidas/BombaTuEquipo.png" alt="Munición tu equipo">
          <span id="hudMunicionTu" class="hud-valor">-</span>
        </div>
        <div class="hud-metrica">
          <img id="hudIconPortaTu" class="hud-icono hud-icono-porta" src="/frontend/Imagenes/ContadorDeVidas/PortaTuEquipo.png" alt="Vida porta tu equipo">
          <span id="hudVidaTu" class="hud-valor">-/-</span>
        </div>
      </div>
    </div>

    <div class="hud-bloque hud-equipo-enemigo">
      <div class="hud-encabezado">
        <div class="hud-titulo" id="hudTituloEnemigo">EQUIPO ENEMIGO</div>
        <div class="hud-subtitulo" id="hudTipoEnemigo">-</div>
      </div>
      <div class="hud-metricas">
        <div class="hud-metrica">
          <img id="hudIconDronEnemigo" class="hud-icono" src="/frontend/Imagenes/ContadorDeVidas/DronAereoEquipoEnemigo.png" alt="Drones equipo enemigo">
          <span id="hudDronesEnemigo" class="hud-valor">-</span>
        </div>
        <div class="hud-metrica">
          <img id="hudIconMunicionEnemigo" class="hud-icono" src="/frontend/Imagenes/ContadorDeVidas/BombaEquipoEnemigo.png" alt="Munición equipo enemigo">
          <span id="hudMunicionEnemigo" class="hud-valor">-</span>
        </div>
        <div class="hud-metrica">
          <img id="hudIconPortaEnemigo" class="hud-icono hud-icono-porta" src="/frontend/Imagenes/ContadorDeVidas/PortaEquipoEnemigo.png" alt="Vida porta equipo enemigo">
          <span id="hudVidaEnemigo" class="hud-valor">-/-</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Pie de página reservado -->
  <footer class="footer"></footer>

  <!-- Cartel de aviso al recibir ataque -->
  <div id="avisoAtaque" class="aviso-ataque" aria-live="polite" aria-atomic="true" role="alert">
    <div class="aviso-contenido">
      <p id="avisoTexto" class="aviso-texto"></p>
    </div>
  </div>

  <div id="errorModal" class="modal-overlay error" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box error-box">
      <p class="error-title">ERROR:</p>
      <p id="errorMessage" class="error-message"></p>
      <div class="modal-actions">
        <button id="errorOk" class="game-btn error-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal de fin de partida (Victoria/Derrota) -->
  <div id="finPartidaModal" class="modal-overlay fin-partida" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box fin-partida-box">
      <div id="finPartidaTitulo" class="fin-partida-titulo">VICTORIA</div>
      <div id="finPartidaSubtitulo" class="fin-partida-subtitulo">Destroza el porta enemigo</div>
      <div class="fin-partida-separator"></div>
      <div id="finPartidaMensaje" class="fin-partida-mensaje">¡Felicidades! Tu equipo ha ganado la partida.</div>
      <div class="modal-actions">
        <button id="finPartidaVolverBtn" class="game-btn fin-partida-btn" type="button">VOLVER AL MENÚ</button>
      </div>
    </div>
  </div>

  <div id="reanudarEsperaModal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-espera-rival">
      <p class="modal-titulo">PARTIDA EN PAUSA</p>
      <p class="espera-rival-texto">Esperando al rival para continuar la partida...</p>
      <div class="modal-actions">
        <button id="reanudarSalirBtn" class="game-btn" type="button">Salir al menú</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (window.location.protocol === 'file:')
      ? 'http://localhost:8080'
      : '';
    const API = `${API_BASE}/api/game`;

    const FRIENDLY_ERROR_BY_CODE = {
      ACCION_YA_REALIZADA: 'La acción ya fue realizada en este turno.',
      USUARIO_EN_PARTIDA_ACTIVA: 'este usuario ya esta en una partida, ingrrese otro',
      PLAYER_NO_ENCONTRADO: 'No se encontró tu jugador en esta partida. Volvé a ingresar desde INICIO.',
      NO_ES_TU_TURNO: 'Todavía no es tu turno. Esperá a que termine la jugada del rival.',
      YA_DISPARO_EN_ESTE_TURNO: 'Ya realizaste un disparo en este turno.',
      YA_MOVIO_EN_ESTE_TURNO: 'Ya realizaste un movimiento en este turno.',
      SIN_DRON_SELECCIONADO: 'Primero tenés que seleccionar un dron para continuar.',
      DRON_INVALIDO_O_DESTRUIDO: 'El dron seleccionado no está disponible o fue destruido.',
      SIN_MUNICION: 'El dron seleccionado no tiene munición disponible.',
      FUERA_DE_RANGO: 'La celda elegida está fuera del rango de ataque permitido.',
      FUERA_DE_TABLERO: 'La celda seleccionada está fuera del tablero.',
      OBJETIVO_PROPIO: 'No podés apuntar a una unidad de tu propio equipo.',
      OBJETIVO_DESTRUIDO: 'La unidad objetivo ya está destruida.',
      NO_HAY_OBJETIVO_ENEMIGO: 'No hay un objetivo enemigo en esa posición.',
      PARTIDA_NO_EN_JUEGO: 'La partida no está disponible en este momento.',
      ESTADO_INVALIDO: 'No se puede realizar esta acción en el estado actual de la partida.',
      HTTP_404: 'No se encontró el recurso solicitado en el servidor.',
      HTTP_500: 'El servidor tuvo un problema interno al procesar la acción.',
      HTTP_503: 'El servidor está temporalmente no disponible. Intentá nuevamente en unos segundos.'
    };

    function esErrorPartidaNoJugable(input) {
      const text = normalizeErrorInput(input);
      const normalized = text.toUpperCase();
      const code = findErrorCode(text);
      // No tratar finalizada como abandono
      if (code === 'PARTIDA_FINALIZADA' || normalized.includes('FINALIZADA')) {
        return false;
      }
      if (code === 'PARTIDA_NO_EN_JUEGO') return true;
      return normalized.includes('PARTIDA NO EST') && normalized.includes('ESTADO JUGABLE');
    }

    function numeroJugadorRival() {
      const actual = Number(numeroJugadorActual || getSessionValue('numeroJugador'));
      if (actual === 1) return 2;
      if (actual === 2) return 1;
      return null;
    }

    function mensajeAbandonoRival() {
      const rival = numeroJugadorRival();
      if (rival) return `Jugador ${rival} abandonó la partida`;
      return 'El rival abandonó la partida';
    }

    function salirAlInicio() {
      [
        'playerId',
        'idPartida',
        'equipoAsignado',
        'numeroJugador',
        'estrategiaSeleccionada'
      ].forEach((key) => {
        sessionStorage.removeItem(key);
        localStorage.removeItem(key);
      });
      removeSessionValue('origenReanudacion');
      window.location.href = '/frontend/Index.html';
    }

    function mostrarModalEsperaRival() {
      const modal = document.getElementById('reanudarEsperaModal');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('activo');
    }

    function ocultarModalEsperaRival() {
      const modal = document.getElementById('reanudarEsperaModal');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'true');
      modal.classList.remove('activo');
    }

    function normalizeErrorInput(input) {
      const text = String(input ?? '').trim();
      if (!text) return 'Ocurrió un error inesperado. Intentá nuevamente.';
      return text;
    }

    function findErrorCode(text) {
      const matches = text.toUpperCase().match(/[A-Z][A-Z0-9_]{2,}/g);
      if (!matches) return null;
      return matches.find((token) => FRIENDLY_ERROR_BY_CODE[token]) ?? null;
    }

    function toFriendlyErrorMessage(input) {
      const text = normalizeErrorInput(input);
      const code = findErrorCode(text);
      if (code) {
        const normalized = text.toUpperCase();
        if (code === 'ACCION_YA_REALIZADA') {
          if (normalized.includes('NO SE PUEDE MOVER')) return 'No se puede mover: acción ya realizada.';
          if (normalized.includes('NO SE PUEDE DISPARAR')) return 'No se puede disparar: acción ya realizada.';
          return 'La acción ya fue realizada en este turno.';
        }
        return FRIENDLY_ERROR_BY_CODE[code];
      }

      const normalized = text.toUpperCase();
      if (
        normalized.includes('FAILED TO FETCH')
        || normalized.includes('NETWORK')
        || normalized.includes('NO SE PUDO CONECTAR CON EL SERVIDOR')
      ) {
        return 'Se cayó el servidor';
      }
      if (normalized.includes('RESPUESTA NO VÁLIDA DEL SERVIDOR')) {
        return 'El servidor devolvió una respuesta inválida. Intentá nuevamente.';
      }

      return text;
    }

    function hideError() {
      const modal = document.getElementById('errorModal');
      if (!modal) return;
      modal.setAttribute('aria-hidden', 'true');
      modal.classList.remove('activo');
    }

    function showError(message, options = {}) {
      const modal = document.getElementById('errorModal');
      const messageNode = document.getElementById('errorMessage');
      if (!modal || !messageNode) {
        console.error('ERROR:', message);
        return;
      }

      const forzarSalida = options.forceExit === true;
      const abandonoDetectado = forzarSalida || (yaEstuvoEnJuego && esErrorPartidaNoJugable(message));

      messageNode.textContent = abandonoDetectado
        ? mensajeAbandonoRival()
        : toFriendlyErrorMessage(message);

      modal.dataset.locked = abandonoDetectado ? '1' : '0';
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('activo');

      const ok = document.getElementById('errorOk');
      if (ok) {
        ok.textContent = abandonoDetectado ? 'Salir' : 'OK';
        ok.onclick = abandonoDetectado ? salirAlInicio : hideError;
        ok.focus();
      }
    }

    /**
     * Muestra el modal de fin de partida (VICTORIA o DERROTA)
     * @param {boolean} esVictoria - true si ganó el jugador, false si perdió
     * @param {string} motivoFin - "PORTA_DESTRUIDO", "SIN_DRONES", "SIN_MUNICION"
     */
    function mostrarFinPartida(esVictoria, motivoFin) {
      const modal = document.getElementById('finPartidaModal');
      const titulo = document.getElementById('finPartidaTitulo');
      const subtitulo = document.getElementById('finPartidaSubtitulo');
      const mensaje = document.getElementById('finPartidaMensaje');
      const volverBtn = document.getElementById('finPartidaVolverBtn');

      if (!modal) return;

      // Actualizar título
      titulo.textContent = esVictoria ? '¡VICTORIA!' : 'DERROTA';
      titulo.className = 'fin-partida-titulo ' + (esVictoria ? 'victoria' : 'derrota');
      // marcar clase en el contenedor para ajustar colores generales
      const box = modal.querySelector('.fin-partida-box');
      if (box) {
        box.classList.toggle('victoria', esVictoria);
        box.classList.toggle('derrota', !esVictoria);
      }

      // Actualizar subtítulo según motivo
      let textoMotivo = 'Fin de partida';
      let textoDetalle = '';

      switch (motivoFin) {
        case 'PORTA_DESTRUIDO':
          textoMotivo = '🎯 Porta Destruido';
          textoDetalle = esVictoria
            ? 'Destruiste el porta enemigo.'
            : 'Tu porta fue destruido.';
          break;
        case 'SIN_DRONES':
          textoMotivo = '☠️ Sin Drones';
          textoDetalle = esVictoria
            ? 'El enemigo se quedó sin drones.'
            : 'Tu equipo se quedó sin drones.';
          break;
        case 'SIN_MUNICION':
          textoMotivo = '💥 Sin Munición';
          textoDetalle = esVictoria
            ? 'El enemigo se quedó sin munición.'
            : 'Tu equipo se quedó sin munición.';
          break;
        case 'ABANDONO':
          textoMotivo = '🚩 Abandono';
          textoDetalle = esVictoria
            ? 'Ganaste porque el rival abandonó la partida.'
            : 'Abandonaste la partida. Tu equipo perdió por abandono.';
          break;
      }

      subtitulo.textContent = textoMotivo;
      mensaje.textContent = textoDetalle || (esVictoria
        ? '¡Felicidades! Tu equipo ha ganado la partida.'
        : 'Lamentablemente tu equipo ha perdido. ¡Intenta de nuevo!');

      // Mostrar modal
      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('activo');

      // Configurar botón
      if (volverBtn) {
        volverBtn.textContent = 'VOLVER AL MENÚ';
        volverBtn.onclick = salirAlInicio;
        volverBtn.focus();
      }

      // Deshabilitar controles de juego
      if (btnMover) btnMover.disabled = true;
      if (btnDisparar) btnDisparar.disabled = true;
      const btnPlay = document.getElementById('btnPlay');
      if (btnPlay) btnPlay.disabled = true;
      const btnAbandonar = document.getElementById('btnAbandonar');
      if (btnAbandonar) btnAbandonar.disabled = true;

      // Limpiar selecciones
      limpiarSeleccionLocal();

      // Detener actualización de partida
      detenerActualizacionPartida();
    }

    window.alert = (message) => showError(message);

    function getSessionValue(key) {
      const fromSession = sessionStorage.getItem(key);
      if (fromSession !== null) {
        return fromSession;
      }
      const legacyValue = localStorage.getItem(key);
      if (legacyValue !== null) {
        sessionStorage.setItem(key, legacyValue);
        localStorage.removeItem(key);
      }
      return legacyValue;
    }

    function setSessionValue(key, value) {
      sessionStorage.setItem(key, value);
      localStorage.removeItem(key);
    }

    function removeSessionValue(key) {
      sessionStorage.removeItem(key);
      localStorage.removeItem(key);
    }

    let playerId = getSessionValue('playerId');
    const indicadorJugador = document.getElementById('indicadorJugador');
    const indicadorTurno = document.getElementById('indicadorTurno');
    const cronometroTurno = document.getElementById('cronometroTurno');
    const btnMover = document.getElementById('btnMover');
    const btnDisparar = document.getElementById('btnDisparar');
    const btnAbandonar = document.getElementById('btnAbandonar');
    const indicadorEsperaJugador2 = document.getElementById('indicadorEsperaJugador2');
    const hudTipoTuEquipo = document.getElementById('hudTipoTuEquipo');
    const hudTipoEnemigo = document.getElementById('hudTipoEnemigo');
    const hudDronesTu = document.getElementById('hudDronesTu');
    const hudDronesEnemigo = document.getElementById('hudDronesEnemigo');
    const hudMunicionTu = document.getElementById('hudMunicionTu');
    const hudMunicionEnemigo = document.getElementById('hudMunicionEnemigo');
    const hudVidaTu = document.getElementById('hudVidaTu');
    const hudVidaEnemigo = document.getElementById('hudVidaEnemigo');
    const hudIconDronTu = document.getElementById('hudIconDronTu');
    const hudIconDronEnemigo = document.getElementById('hudIconDronEnemigo');
    const hudIconMunicionTu = document.getElementById('hudIconMunicionTu');
    const hudIconMunicionEnemigo = document.getElementById('hudIconMunicionEnemigo');
    const hudIconPortaTu = document.getElementById('hudIconPortaTu');
    const hudIconPortaEnemigo = document.getElementById('hudIconPortaEnemigo');
    const errorModal = document.getElementById('errorModal');
    const errorOk = document.getElementById('errorOk');
    const reanudarSalirBtn = document.getElementById('reanudarSalirBtn');

    if (errorOk) {
      errorOk.textContent = 'OK';
      errorOk.onclick = hideError;
    }
    if (errorModal) {
      errorModal.addEventListener('click', (event) => {
        if (event.target === errorModal && errorModal.dataset.locked !== '1') {
          hideError();
        }
      });
    }
    document.addEventListener('keydown', (event) => {
      if (
        event.key === 'Escape'
        && errorModal?.getAttribute('aria-hidden') === 'false'
        && errorModal?.dataset.locked !== '1'
      ) {
        hideError();
      }
    });

    if (reanudarSalirBtn) {
      reanudarSalirBtn.addEventListener('click', salirAlInicio);
    }
    let numeroJugadorActual = Number(getSessionValue('numeroJugador'));
    const TIEMPO_TURNO_SEGUNDOS = 30;
    let duracionTurnoSegundos = TIEMPO_TURNO_SEGUNDOS;
    let segundosRestantesTurno = 0;
    let ultimoNumeroTurno = null;
    let autoPasandoTurno = false;
    let refreshInFlight = false;
    let recuperandoSesion = false;
    let alertaSesionMostrada = false;
    let yaEstuvoEnJuego = false;
    let abandonoNotificado = false;
    let refreshIntervalId = null;
    let desconexionNotificada = false;

    // Variables para detectar daño recibido
    let estadoUnitadesAnterior = null;
    let ultimoEventoDanio = null;

    function detenerActualizacionPartida() {
      if (refreshIntervalId !== null) {
        clearInterval(refreshIntervalId);
        refreshIntervalId = null;
      }
    }
    function getPlayerIdActual() {
      if (!playerId) {
        playerId = getSessionValue('playerId');
      }
      return playerId;
    }

    async function intentarRecuperarSesion() {
      if (recuperandoSesion) return false;
      const nombreUsuario = getSessionValue('nombreUsuario');
      if (!nombreUsuario) return false;

      recuperandoSesion = true;
      try {
        const join = await apiRequest(`/join?nombre=${encodeURIComponent(nombreUsuario)}`, 'POST');
        if (!join || !join.playerId) {
          return false;
        }

        playerId = join.playerId;
        setSessionValue('playerId', join.playerId);
        if (join.idPartida) setSessionValue('idPartida', join.idPartida);
        if (join.equipo) setSessionValue('equipoAsignado', join.equipo);
        if (join.numeroJugador === 1 || join.numeroJugador === 2) {
          setSessionValue('numeroJugador', String(join.numeroJugador));
        }
        alertaSesionMostrada = false;
        return true;
      } catch (_) {
        return false;
      } finally {
        recuperandoSesion = false;
      }
    }


    // el backend controlarÃ¡ si el jugador ya realizÃ³ una acciÃ³n en el turno,
    // el frontend no guarda este estado en almacenamiento persistente compartido.

    function actualizarIndicadorJugador(numeroJugador) {
      if (!indicadorJugador) return;

      indicadorJugador.classList.remove('jugador-1', 'jugador-2');

      if (numeroJugador === 1) {
        indicadorJugador.textContent = 'JUGADOR 1';
        indicadorJugador.classList.add('jugador-1');
        return;
      }

      if (numeroJugador === 2) {
        indicadorJugador.textContent = 'JUGADOR 2';
        indicadorJugador.classList.add('jugador-2');
        return;
      }

      indicadorJugador.textContent = 'JUGADOR';
    }

    function actualizarIndicadorTurno(esMiTurno) {
      if (!indicadorTurno) return;

      indicadorTurno.classList.remove('tu-turno', 'otro-turno');

      if (esMiTurno === true) {
        indicadorTurno.textContent = 'TU TURNO';
        indicadorTurno.classList.add('tu-turno');
        return;
      }

      if (esMiTurno === false) {
        indicadorTurno.textContent = 'TURNO ENEMIGO';
        indicadorTurno.classList.add('otro-turno');
        return;
      }

      indicadorTurno.textContent = '';
    }

    function actualizarCronometroTurnoVisual(mostrar) {
      if (!cronometroTurno) return;
      if (mostrar) {
        cronometroTurno.textContent = `${Math.max(segundosRestantesTurno, 0)}s`;
      } else {
        cronometroTurno.textContent = '';
      }
    }

    function sincronizarCronometroTurno(esMiTurno, segundosRestantes, duracionSegundos) {
      if (Number.isFinite(duracionSegundos) && duracionSegundos > 0) {
        duracionTurnoSegundos = duracionSegundos;
      }

      if (Number.isFinite(segundosRestantes)) {
        segundosRestantesTurno = Math.max(0, segundosRestantes);
      } else {
        segundosRestantesTurno = duracionTurnoSegundos;
      }

      actualizarCronometroTurnoVisual(esMiTurno === true);
    }

    function actualizarCartelEsperaJugador2(estadoPartida, numeroJugador) {
      if (!indicadorEsperaJugador2) return;

      const esJugador1 = Number(numeroJugador) === 1;
      const esperandoRival = String(estadoPartida || '').toUpperCase() === 'ESPERANDO_RIVAL';

      if (esJugador1 && esperandoRival) {
        indicadorEsperaJugador2.textContent = 'ESPERANDO JUGADOR 2';
        indicadorEsperaJugador2.classList.add('visible');
        return;
      }

      indicadorEsperaJugador2.textContent = '';
      indicadorEsperaJugador2.classList.remove('visible');
    }

    // entrega: función genérica para terminar el turno. Se puede invocar
    // desde el timeout o desde un botón manual. Retorna la respuesta si hay OK
    // y lanza error en caso contrario.
    async function pasarTurno() {
      const playerIdActual = getPlayerIdActual();
      if (autoPasandoTurno || !playerIdActual) return;

    function enterShootMode(reintento = false) {
      if (!selectedDron || shootMode) return;
      shootMode = true;

      (async () => {
        try {
          const playerIdShoot = getPlayerIdActual();
          if (!playerIdShoot) {
            alert('Jugador no identificado');
            exitShootMode();
            return;
          }

          const disponibles = await apiRequest(`/availableShots2?playerId=${encodeURIComponent(playerIdShoot)}`);
          if (!disponibles.ok) {
            if (!reintento && disponibles.estado === 'SIN_DRON_SELECCIONADO' && selectedDron?.id) {
              const sel = await apiRequest(
                `/selectDrone2?playerId=${encodeURIComponent(playerIdShoot)}&dronId=${encodeURIComponent(selectedDron.id)}`,
                'POST'
              );
              if (sel?.ok) {
                exitShootMode();
                enterShootMode(true);
                return;
              }
            }
            alert('No se puede disparar: ' + (disponibles.estado || 'ERROR'));
            exitShootMode();
            return;
          }

          const celdasDisponibles = disponibles.celdas || [];

          celdasDisponibles.forEach(({x, y}) => {
            const celdaData = celdas.find(c => c.col === x && c.fila === y);
            if (!celdaData) return;

            const celda = celdaData.celda;
            celda.classList.add('movible');
            const handler = async () => {
              try {
                const playerIdShootActual = getPlayerIdActual();
                if (!playerIdShootActual) {
                  alert('Jugador no identificado');
                  return;
                }

                const data = await apiRequest(
                  `/shoot2?playerId=${encodeURIComponent(playerIdShootActual)}&fila=${y}&col=${x}`,
                  'POST'
                );

                if (data.ok) {
                  if (btnDisparar) btnDisparar.disabled = true;
                  exitShootMode();

                  // === DISPARAR ANIMACIÓN LATERAL SI HAY HIT ===
                  if (data.resultado === "HIT" && selectedDron && typeof SkySeaLateral !== 'undefined') {
                    try {
                      // Mapear tipo de proyectil
                      const weapon = data.tipoProyectilDisparo === "MISIL" ? "missile" : "bomb";
                      
                      // Mapear atacante basado en selectedDron
                      let attacker = "dronnaval"; // default
                      if (selectedDron.tipo === "DRON_AEREO") {
                        attacker = "dronaereo";
                      }

                      // Mapear objetivo (data.objetivo es "DRON" o "PORTA" o "NADA")
                      let target = null;
                      if (data.objetivo === "DRON") {
                        // Si es bomba y atacante es aéreo → dron naval
                        // Si es misil y atacante es naval → dron aéreo
                        target = weapon === "bomb" ? "dronnaval" : "dronaereo";
                      } else if (data.objetivo === "PORTA") {
                        // Porta aéreo recibe misiles, porta naval recibe bombas
                        target = weapon === "bomb" ? "portanaval" : "portaaereo";
                      }

                      if (target) {
                        // Inferir si es destroy o damage
                        let result = "damage"; // default
                        if (data.objetivo === "DRON") {
                          // Dron aéreo muere con 1 misil, dron naval con 2 bombas
                          if (weapon === "missile" && target === "dronaereo") {
                            result = "destroy"; // dron aéreo destruido por 1 misil
                          } else if (weapon === "bomb" && target === "dronnaval" && data.vidaObjetivo === 0) {
                            result = "destroy"; // 2do impacto
                          }
                        } else if (data.objetivo === "PORTA") {
                          // Si impactosRestantesPorta es 0 o null, es destrucción
                          if (data.impactosRestantesPorta === 0 || (data.impactosRestantesPorta === null && data.resultado === "HIT")) {
                            result = "destroy";
                          }
                        }

                        const evento = {
                          weapon,
                          attacker,
                          target,
                          result,
                          remainingHealth: data.impactosRestantesPorta !== undefined ? data.impactosRestantesPorta : null
                        };

                        console.log("[Disparo] Lanzando animación:", evento);
                        await SkySeaLateral.playShotEvent(evento);
                      }
                    } catch (errAnim) {
                      console.warn("[Disparo] Error al reproducir animación lateral:", errAnim);
                    }
                  }

                  await refreshPartidaState();
                } else {
                  alert('Disparo inválido: ' + (data.estado || 'ERROR'));
                }
              } catch (err) {
                alert('Error al disparar: ' + err.message);
              }
            };

            celda.addEventListener('click', handler);
            shootCells.push({ cell: celda, handler });
          });
        } catch (error) {
          alert('No se pudieron obtener disparos válidos: ' + error.message);
          exitShootMode();
        }
      })();
    }

    function calcularResumenEquipo(board, equipo, resumenPreferido, resumenAlterno) {
      const resumenMi = board?.resumenMiEquipo;
      const resumenEnemigo = board?.resumenEnemigo;
      const candidatos = [resumenPreferido, resumenAlterno, resumenMi, resumenEnemigo].filter(Boolean);
      const maxEsperado = impactosMaximosPorta(equipo);

      let resumenBackend = candidatos.find(r => r?.equipo === equipo);
      if (!resumenBackend) {
        resumenBackend = candidatos.find(r => r?.impactosMaximosPorta === maxEsperado);
      }
      if (!resumenBackend) {
        resumenBackend = candidatos.find(r =>
          (r?.dronesActivos ?? 0) > 0 ||
          (r?.municionTotal ?? 0) > 0 ||
          (r?.impactosRestantesPorta ?? 0) > 0
        );
      }
      if (!resumenBackend) {
        resumenBackend = candidatos[0] || null;
      }

      if (resumenBackend) {
        return {
          vidaRestante: resumenBackend.impactosRestantesPorta ?? 0,
          vidaMax: resumenBackend.impactosMaximosPorta ?? impactosMaximosPorta(equipo),
          dronesActivos: resumenBackend.dronesActivos ?? 0,
          municionRestante: resumenBackend.municionTotal ?? 0
        };
      }

      const drones = (board.drones || []).filter(d => d.equipo === equipo && !d.destruido);
      const porta = (board.portas || []).find(p => p.equipo === equipo);
      const vidaMax = impactosMaximosPorta(equipo);
      const vidaRestante = porta ? porta.impactosRestantes : 0;
      const dronesActivos = drones.length;
      const municionRestante = drones.reduce((total, dron) => total + (dron.municion || 0), 0);

      return {
        vidaRestante,
        vidaMax,
        dronesActivos,
        municionRestante
      };
    }

    function actualizarHudInferior(board) {
      if (!board) return;

      const miEquipo = board.miEquipo || getSessionValue('equipoAsignado') || 'NAVAL';
      const enemigo = equipoContrario(miEquipo);

      const resumenTu = calcularResumenEquipo(board, miEquipo, board?.resumenMiEquipo, board?.resumenEnemigo);
      const resumenEnemigo = calcularResumenEquipo(board, enemigo, board?.resumenEnemigo, board?.resumenMiEquipo);

      if (hudTipoTuEquipo) hudTipoTuEquipo.textContent = nombreEquipo(miEquipo);
      if (hudTipoEnemigo) hudTipoEnemigo.textContent = nombreEquipo(enemigo);

      if (hudDronesTu) hudDronesTu.textContent = String(resumenTu.dronesActivos);
      if (hudDronesEnemigo) hudDronesEnemigo.textContent = String(resumenEnemigo.dronesActivos);
      if (hudMunicionTu) hudMunicionTu.textContent = String(resumenTu.municionRestante);
      if (hudMunicionEnemigo) hudMunicionEnemigo.textContent = String(resumenEnemigo.municionRestante);
      if (hudVidaTu) hudVidaTu.textContent = `${resumenTu.vidaRestante}/${resumenTu.vidaMax}`;
      if (hudVidaEnemigo) hudVidaEnemigo.textContent = `${resumenEnemigo.vidaRestante}/${resumenEnemigo.vidaMax}`;

      const iconosTu = obtenerRutasIconosPorEquipo(miEquipo, true);
      const iconosEnemigo = obtenerRutasIconosPorEquipo(enemigo, false);

      if (hudIconDronTu) hudIconDronTu.src = iconosTu.dron;
      if (hudIconMunicionTu) hudIconMunicionTu.src = iconosTu.municion;
      if (hudIconPortaTu) hudIconPortaTu.src = iconosTu.porta;

      if (hudIconDronEnemigo) hudIconDronEnemigo.src = iconosEnemigo.dron;
      if (hudIconMunicionEnemigo) hudIconMunicionEnemigo.src = iconosEnemigo.municion;
      if (hudIconPortaEnemigo) hudIconPortaEnemigo.src = iconosEnemigo.porta;
    }

    function detectarYMostrarDanioRecibido(board) {
      if (!board || !estadoUnitadesAnterior) return;
      
      const miEquipo = board.miEquipo || getSessionValue('equipoAsignado') || 'NAVAL';
      
      // Obtener estado actual
      const dronesActuales = (board.drones || []).filter(d => d.equipo === miEquipo && !d.destruido);
      const portaActual = (board.portas || []).find(p => p.equipo === miEquipo);
      
      const vidaPortaActual = portaActual ? portaActual.impactosRestantes : 0;
      const dronesActivosActuales = dronesActuales.length;
      
      // Comparar con estado anterior
      const vidaPortaAnterior = estadoUnitadesAnterior.vidaPorta;
      const dronesActivosAnteriores = estadoUnitadesAnterior.dronesActivos;
      
      // Detectar si la porta fue dañada o destruida
      if (vidaPortaAnterior > 0 && vidaPortaActual < vidaPortaAnterior) {
        const eventoId = `porta-${ultimoNumeroTurno}-${vidaPortaActual}`;
        if (ultimoEventoDanio !== eventoId) {
          ultimoEventoDanio = eventoId;
          if (vidaPortaActual === 0) {
            mostrarAvisoAtaque('¡Tu porta fue destruida!');
          } else {
            mostrarAvisoAtaque('¡Tu porta fue dañada!');
          }
          return;
        }
      }
      
      // Detectar si drones fueron destruidos
      if (dronesActivosAnteriores > 0 && dronesActivosActuales < dronesActivosAnteriores) {
        const eventoId = `drones-${ultimoNumeroTurno}-${dronesActivosActuales}`;
        if (ultimoEventoDanio !== eventoId) {
          ultimoEventoDanio = eventoId;
          mostrarAvisoAtaque('¡Tu dron fue destruido!');
          return;
        }
      }
      
      // Detectar si drones fueron dañados (sin ser destruidos)
      if (dronesActuales.length > 0 && dronesActivosAnteriores > 0) {
        const dronConDanio = dronesActuales.some(d => {
          const anteriorDron = estadoUnitadesAnterior.drones.find(a => a.id === d.id);
          return anteriorDron && d.vida < anteriorDron.vida;
        });
        
        if (dronConDanio) {
          const eventoId = `danio-dron-${ultimoNumeroTurno}`;
          if (ultimoEventoDanio !== eventoId) {
            ultimoEventoDanio = eventoId;
            mostrarAvisoAtaque('¡Tu dron fue dañado!');
            return;
          }
        }
      }
    }

    function capturarEstadoUnitades(board) {
      if (!board) return;
      
      const miEquipo = board.miEquipo || getSessionValue('equipoAsignado') || 'NAVAL';
      const dronesActuales = (board.drones || []).filter(d => d.equipo === miEquipo);
      const portaActual = (board.portas || []).find(p => p.equipo === miEquipo);
      
      estadoUnitadesAnterior = {
        vidaPorta: portaActual ? portaActual.impactosRestantes : 0,
        dronesActivos: dronesActuales.filter(d => !d.destruido).length,
        drones: dronesActuales.map(d => ({
          id: d.id,
          vida: d.vida,
          destruido: d.destruido
        }))
      };
    }

    async function apiRequest(path, method = 'GET') {
      const response = await fetch(`${API}${path}`, { method });
      const raw = await response.text();
      let data = null;

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error(`Respuesta no válida del servidor (HTTP ${response.status})`);
        }
      }

      if (!response.ok) {
        throw new Error(data?.error || `HTTP_${response.status}`);
      }
      if (data?.error) {
        throw new Error(data.error);
      }

      return data || {};
    }

    function notificarDesconexion() {
      if (desconexionNotificada) {
        return;
      }

      const playerIdActual = getPlayerIdActual();
      if (!playerIdActual) {
        return;
      }

      const url = `${API}/disconnect?playerId=${encodeURIComponent(playerIdActual)}`;
      desconexionNotificada = true;

      try {
        if (navigator.sendBeacon) {
          const sent = navigator.sendBeacon(url);
          if (sent) {
            return;
          }
        }
      } catch (_) {
        // ignore and fallback to fetch keepalive
      }

      try {
        fetch(url, { method: 'POST', keepalive: true });
      } catch (_) {
        // best effort only during page unload
      }
    }

    window.addEventListener('pagehide', notificarDesconexion);
    window.addEventListener('beforeunload', notificarDesconexion);

    async function refreshPartidaState() {
      let playerIdActual = getPlayerIdActual();
      if (!playerIdActual) {
        const recuperado = await intentarRecuperarSesion();
        if (!recuperado) {
          if (!alertaSesionMostrada) {
            alertaSesionMostrada = true;
            alert('No se pudo recuperar tu sesión. Vuelve a entrar desde INICIO.');
          }
          return;
        }
        playerIdActual = getPlayerIdActual();
      }

      if (refreshInFlight) {
        return;
      }
      refreshInFlight = true;

      try {
        let state;
        try {
          state = await apiRequest(`/state2?playerId=${encodeURIComponent(playerIdActual)}`);
        } catch (stateError) {
          const msg = String(stateError?.message || '').toUpperCase();
          // Si el backend ya no reconoce el playerId (p. ej. tras reset), reintentar
          // una sola vez recuperando sesión por nombre.
          if (msg.includes('PLAYER_NO_ENCONTRADO')) {
            playerId = null;
            removeSessionValue('playerId');
            const recuperado = await intentarRecuperarSesion();
            if (recuperado) {
              playerIdActual = getPlayerIdActual();
              if (!playerIdActual) {
                throw stateError;
              }
              state = await apiRequest(`/state2?playerId=${encodeURIComponent(playerIdActual)}`);
            } else {
              throw stateError;
            }
          } else {
            throw stateError;
          }
        }

        // ========== VERIFICAR FIN DE PARTIDA ==========
        if (state.partidaFinalizada === true || state.estadoPartida === 'FINALIZADA') {
          const equipoActual = state.equipo || getSessionValue('equipoAsignado');
          const esVictoria = state.ganador === equipoActual;
          ocultarModalEsperaRival();
          removeSessionValue('origenReanudacion');
          mostrarFinPartida(esVictoria, state.motivoFin);
          // detener actualización y evitar próxima llamada a board
          refreshInFlight = false;
          return; // No continuar actualizando
        }

        const esReanudacion = getSessionValue('origenReanudacion') === '1';
        const esperandoRival = String(state.estadoPartida || '').toUpperCase() === 'ESPERANDO_RIVAL';
        if (esperandoRival) {
          mostrarModalEsperaRival();
        } else {
          ocultarModalEsperaRival();
          if (esReanudacion && state.estadoPartida === 'EN_JUEGO') {
            removeSessionValue('origenReanudacion');
          }
        }

        if (state.equipo) {
          setSessionValue('equipoAsignado', state.equipo);
        }

        if (state.numeroJugador === 1 || state.numeroJugador === 2) {
          numeroJugadorActual = state.numeroJugador;
          setSessionValue('numeroJugador', String(state.numeroJugador));
          actualizarIndicadorJugador(state.numeroJugador);
          actualizarCartelEsperaJugador2(state.estadoPartida, state.numeroJugador);

          if (String(state.estadoPartida || '').toUpperCase() === 'EN_JUEGO') {
            yaEstuvoEnJuego = true;
          }

          const numeroTurnoRecibido = Number(state.numeroTurno);
          if (Number.isFinite(numeroTurnoRecibido)) {
            if (ultimoNumeroTurno !== null && numeroTurnoRecibido !== ultimoNumeroTurno) {
              limpiarSeleccionLocal();
            }
            ultimoNumeroTurno = numeroTurnoRecibido;
          }

          if (state.turnoDe && state.equipo && state.estadoPartida === 'EN_JUEGO') {
            const esMiTurno = state.esMiTurno === true || state.turnoDe === state.equipo;
            actualizarIndicadorTurno(esMiTurno);
            sincronizarCronometroTurno(
              esMiTurno,
              Number(state.segundosRestantesTurno),
              Number(state.duracionTurnoSegundos)
            );

            // controlar habilitación de botón mover
            if (btnMover) {
              if (!esMiTurno) {
                limpiarSeleccionLocal();
              } else {
                btnMover.disabled = !selectedDron;
              }
            }
          } else {
            sincronizarCronometroTurno(false, 0, Number(state.duracionTurnoSegundos));
          }
        } else {
          actualizarCartelEsperaJugador2(state.estadoPartida, numeroJugadorActual);
          sincronizarCronometroTurno(false, 0, Number(state.duracionTurnoSegundos));
        }

        try {
          const board = await apiRequest(`/board?playerId=${encodeURIComponent(playerIdActual)}`);
          
          // Inicializar estado de unidades si es primera carga
          if (estadoUnitadesAnterior === null) {
            capturarEstadoUnitades(board);
          } else {
            // Detectar daño y mostrar aviso si lo hay
            detectarYMostrarDanioRecibido(board);
          }
          
          actualizarRenderPortasDesdeBoard(board);
          actualizarRenderDronesDesdeBoard(board);
          actualizarHudInferior(board);
          
          // Capturar estado actual como anterior para próxima iteración
          capturarEstadoUnitades(board);
        } catch (errBoard) {
          console.warn('No se pudo actualizar HUD inferior:', errBoard.message);
        }
      } catch (error) {
        actualizarCartelEsperaJugador2(null, numeroJugadorActual);
        sincronizarCronometroTurno(false, 0, duracionTurnoSegundos);

        if (yaEstuvoEnJuego && esErrorPartidaNoJugable(error?.message || error)) {
          if (!abandonoNotificado) {
            abandonoNotificado = true;
            detenerActualizacionPartida();
            showError(mensajeAbandonoRival(), { forceExit: true });
          }
          return;
        }

        if (String(error.message || '').includes('PLAYER_NO_ENCONTRADO')) {
          await intentarRecuperarSesion();
          return;
        }
        console.warn('Error al refrescar estado de partida:', error.message);

    function normalizarTipoPlantilla(estrategiaSeleccionada) {
      if (!estrategiaSeleccionada) return null;
      const s = estrategiaSeleccionada.trim().toUpperCase();
      if (s.startsWith('AEREO') || s.startsWith('NAVAL')) return estrategiaSeleccionada;
      return null;
    }

    function convertirBoardAFormacion(board, equipoAsignado) {
      const porta = (board.portas || []).find(p => p.equipo === equipoAsignado);
      const drones = (board.drones || [])
        .filter(d => d.equipo === equipoAsignado && !d.destruido)
        .map(d => ({
          id: d.id,                    // conservar identificador del dron
          fila: d.y,
          col: d.x,
          tipo: d.tipo === 'DRON_AEREO' ? 'DronAereo' : 'DronMisil'
        }));

      const puertos = porta
        ? porta.celdas.map(c => ({
            fila: c.y,
            col: c.x,
            tipo: equipoAsignado === 'AEREO' ? 'PortaAereo' : 'PortaNaval'
          }))
        : [];

      return { puertos, drones };
    }

      celdas.forEach(({ celda }) => {
        celda.classList.remove('ocupada-puerto');
        celda.querySelectorAll('img[data-porta-render="1"], img.porta-aereo-2x5, img.porta-aereo-vertical-5x2, img.porta-naval-completo-7-celdas, img.porta-naval-vertical-7-celdas').forEach((img) => img.remove());
      });
    }

    function obtenerClasePortaPorForma(celdasPorta, equipo) {
      if (!Array.isArray(celdasPorta) || celdasPorta.length === 0) {
        return equipo === 'AEREO' ? 'porta-aereo-2x5' : 'porta-naval-completo-7-celdas';
      }

      const filas = celdasPorta.map((c) => Number(c.y));
      const cols = celdasPorta.map((c) => Number(c.x));
      const spanFilas = Math.max(...filas) - Math.min(...filas) + 1;
      const spanCols = Math.max(...cols) - Math.min(...cols) + 1;
      const esHorizontal = spanCols >= spanFilas;

      if (equipo === 'AEREO') {
        return esHorizontal ? 'porta-aereo-2x5' : 'porta-aereo-vertical-5x2';
      }

      return esHorizontal ? 'porta-naval-completo-7-celdas' : 'porta-naval-vertical-7-celdas';
    }

    function actualizarRenderPortasDesdeBoard(board) {
      if (!board || !Array.isArray(board.portas)) return;
      const miEquipo = board.miEquipo || getSessionValue('equipoAsignado');

      celdas.forEach(({ celda }) => {
        celda.classList.remove('ocupada-puerto');
        celda.querySelectorAll('img.porta-aereo-2x5:not([data-porta-render="1"]), img.porta-aereo-vertical-5x2:not([data-porta-render="1"]), img.porta-naval-completo-7-celdas:not([data-porta-render="1"]), img.porta-naval-vertical-7-celdas:not([data-porta-render="1"])').forEach((imgLegacy) => imgLegacy.remove());
      });

      const renderDeseado = new Map();

      board.portas.forEach((porta) => {
        const celdasPorta = Array.isArray(porta?.celdas) ? porta.celdas : [];
        if (celdasPorta.length === 0) return;

        const celdasOrdenadas = [...celdasPorta].sort(
          (a, b) => Number(a.y) - Number(b.y) || Number(a.x) - Number(b.x)
        );

        celdasOrdenadas.forEach((c) => {
          const celdaData = celdas.find((x) => x.fila === Number(c.y) && x.col === Number(c.x));
          if (!celdaData) return;
          celdaData.celda.classList.add('ocupada-puerto');
        });

        const esEnemigo = miEquipo && porta.equipo && porta.equipo !== miEquipo;
        const celdasEsperadas = porta.equipo === 'AEREO' ? 10 : 7;
        if (esEnemigo && celdasOrdenadas.length < celdasEsperadas) {
          return;
        }

        const ancla = celdasOrdenadas[0];
        const key = `${porta.equipo}-${Number(ancla.y)}-${Number(ancla.x)}-${celdasOrdenadas.length}`;
        renderDeseado.set(key, {
          key,
          filaAncla: Number(ancla.y),
          colAncla: Number(ancla.x),
          clase: obtenerClasePortaPorForma(celdasOrdenadas, porta.equipo),
          src: porta.equipo === 'AEREO'
            ? '/frontend/Imagenes/PortaAereo/PortaAereoVistaDesdeArriba.png'
            : '/frontend/Imagenes/PortaNaval/PortaNavalVistaDeArriba.png',
          alt: porta.equipo === 'AEREO' ? 'Porta Aéreo' : 'Porta Naval'
        });
      });

      const existentes = [];
      celdas.forEach(({ celda, fila, col }) => {
        celda.querySelectorAll('img[data-porta-render="1"]').forEach((img) => {
          existentes.push({
            img,
            celda,
            fila,
            col,
            key: img.dataset.portaKey || ''
          });
        });
      });

      const usados = new Set();

      renderDeseado.forEach((objetivo, key) => {
        const celdaAncla = celdas.find((x) => x.fila === objetivo.filaAncla && x.col === objetivo.colAncla);
        if (!celdaAncla) return;

        let renderExistente = existentes.find((r) => r.key === key);
        let img = renderExistente?.img;

        if (!img) {
          img = document.createElement('img');
          img.dataset.portaRender = '1';
          img.dataset.portaKey = key;
        }

        if (img.parentElement !== celdaAncla.celda) {
          celdaAncla.celda.appendChild(img);
        }

        if (img.getAttribute('src') !== objetivo.src) {
          img.setAttribute('src', objetivo.src);
        }
        img.setAttribute('alt', objetivo.alt);
        img.className = objetivo.clase;
        img.dataset.portaKey = key;

        usados.add(key);
      });

      existentes.forEach((renderActual) => {
        if (usados.has(renderActual.key)) return;
        renderActual.img.remove();
      });
    }

    function limpiarRenderDronesTablero() {
      celdas.forEach(({ celda }) => {
        celda.classList.remove('ocupada-dron', 'seleccionado', 'celda-ammo-verde', 'celda-ammo-amarillo', 'celda-ammo-rojo');
        delete celda.dataset.dronId;
        celda.querySelectorAll('img.elemento-formacion').forEach((img) => img.remove());
      });

    function obtenerClaseMunicionCelda(tipoProyectil, ammoRemaining) {
      const tipo = String(tipoProyectil || '').toUpperCase();
      const ammo = Number(ammoRemaining);
      const ammoNormalizado = Number.isFinite(ammo) ? ammo : 0;

      if (tipo === 'MISIL') {
        if (ammoNormalizado <= 0) return 'celda-ammo-rojo';
        if (ammoNormalizado === 1) return 'celda-ammo-amarillo';
        return 'celda-ammo-verde';
      }

      if (tipo === 'BOMBA') {
        return ammoNormalizado > 0 ? 'celda-ammo-verde' : 'celda-ammo-rojo';
      }

      return '';
    }

    function actualizarRenderDronesDesdeBoard(board) {
      if (!board || !Array.isArray(board.drones)) return;
      const miEquipo = board.miEquipo || getSessionValue('equipoAsignado');

      const dronesObjetivo = new Map();
      board.drones.forEach((dron) => {
        if (!dron) return;
        if (dron.alive === false || dron.destruido === true) return;
        if (!dron.id) return;

        const fila = Number(dron.y);
        const col = Number(dron.x);
        if (!Number.isFinite(fila) || !Number.isFinite(col)) return;

        dronesObjetivo.set(String(dron.id), {
          id: String(dron.id),
          fila,
          col,
          equipo: dron.equipo,
          tipo: dron.tipo,
          type: dron.type || dron.proyectil,
          ammoRemaining: Number(dron.ammoRemaining)
        });
      });

      const dronesActuales = new Map();
      celdas.forEach(({ celda, fila, col }) => {
        const dronId = celda.dataset.dronId;
        if (!dronId) return;
        dronesActuales.set(String(dronId), { celda, fila, col });
      });

      dronesActuales.forEach((renderActual, dronId) => {
        if (dronesObjetivo.has(dronId)) return;
        renderActual.celda.classList.remove('ocupada-dron', 'seleccionado', 'celda-ammo-verde', 'celda-ammo-amarillo', 'celda-ammo-rojo');
        delete renderActual.celda.dataset.dronId;
        delete renderActual.celda.dataset.dronEquipo;
        renderActual.celda.querySelectorAll('img.elemento-formacion').forEach((img) => img.remove());
      });

      const idsVivos = new Set();
      dronesObjetivo.forEach((dron) => {
        const celdaData = celdas.find(c => c.fila === dron.fila && c.col === dron.col);
        if (!celdaData) return;
        const celdaDestino = celdaData.celda;
        const renderActual = dronesActuales.get(dron.id);

        if (renderActual && renderActual.celda !== celdaDestino) {
          const imgExistente = renderActual.celda.querySelector('img.elemento-formacion');
          renderActual.celda.classList.remove('ocupada-dron', 'seleccionado', 'celda-ammo-verde', 'celda-ammo-amarillo', 'celda-ammo-rojo');
          delete renderActual.celda.dataset.dronId;
          if (imgExistente) {
            celdaDestino.appendChild(imgExistente);
          }
        }

        celdaDestino.classList.add('ocupada-dron');
        celdaDestino.classList.remove('celda-ammo-verde', 'celda-ammo-amarillo', 'celda-ammo-rojo');
        const claseMunicionCelda = obtenerClaseMunicionCelda(dron.type, dron.ammoRemaining);
        if (claseMunicionCelda) {
          celdaDestino.classList.add(claseMunicionCelda);
        }
        celdaDestino.dataset.dronId = dron.id;
        celdaDestino.dataset.dronEquipo = dron.equipo || '';
        celdaDestino.dataset.dronTipo = dron.tipo || ''; // ← AGREGAR ESTA
        idsVivos.add(dron.id);

        let img = celdaDestino.querySelector('img.elemento-formacion');
        if (!img) {
          img = document.createElement('img');
          img.className = 'elemento-formacion';
          celdaDestino.appendChild(img);
        }

        const esAereo = dron.tipo === 'DRON_AEREO';
        const srcObjetivo = esAereo
          ? '/frontend/Imagenes/DronAereo/DronAereoVistaDesdeArriba.png'
          : '/frontend/Imagenes/DronNaval/DronMisilVistaDesdeArriba.png';
        const altObjetivo = esAereo ? 'Dron Aéreo' : 'Dron Misil';
        const classBase = esAereo ? 'elemento-formacion' : 'elemento-formacion dron-derecha';

        if (img.getAttribute('src') !== srcObjetivo) {
          img.setAttribute('src', srcObjetivo);
        }
        img.setAttribute('alt', altObjetivo);
        img.className = classBase;
      });

      if (!selectedDron) {
        return;
      }

      const selectedId = String(selectedDron.id);
      if (!idsVivos.has(selectedId)) {
        selectedDron = null;
        if (btnMover) btnMover.disabled = true;
        if (btnDisparar) btnDisparar.disabled = true;
        return;
      }

      const celdaSeleccionada = celdas.find(c => c.celda.dataset.dronId === selectedId);
      if (celdaSeleccionada) {
        selectedDron.cell = celdaSeleccionada.celda;
        selectedDron.fila = celdaSeleccionada.fila;
        selectedDron.col = celdaSeleccionada.col;
        celdaSeleccionada.celda.classList.add('seleccionado');
      }
    }

    // ====== GENERACIÓN DE CUADRÍCULA Y RENDERIZADO DE FORMACIÓN ======
    (async function () {
      const grid = document.getElementById('grid');
      if (!grid) {
        console.error('No se encontró el elemento grid');
        return;
      }

      if (btnMover) {
        btnMover.addEventListener('click', enterMoveMode);
      }
      if (btnDisparar) {
        btnDisparar.addEventListener('click', enterShootMode);
      }
      if (btnAbandonar) {
        btnAbandonar.addEventListener('click', abandonarPartida);
      }
      // handler botón flecha "terminar turno"
      const btnPlay = document.getElementById('btnPlay');
      if (btnPlay) {
        btnPlay.addEventListener('click', async () => {
          if (!getPlayerIdActual()) {
            alert('Falta playerId');
            return;
          }
          try {
            await pasarTurno();
          } catch (err) {
            alert(err.message);
          }
        });
      }

      if (!getPlayerIdActual()) {
        const recuperado = await intentarRecuperarSesion();
        if (!recuperado) {
          alert('No se encontró sesión activa. Vuelve a entrar desde INICIO.');
          return;
        }
      }

      const playerIdActual = getPlayerIdActual();
      if (!playerIdActual) {
        alert('No se encontró sesión activa. Vuelve a entrar desde INICIO.');
        return;
      }

      const filasTotal = 10;     
      const colsTotal = 20;      
      celdas = [];

      for (let f = 0; f < filasTotal; f++) {
        for (let c = 0; c < colsTotal; c++) {
          const celda = document.createElement('div');
          celda.className = 'celda';
          
          celda.dataset.fila = f;
          celda.dataset.col = c;
          
          celda.addEventListener('click', async () => {
            const dronId = celda.dataset.dronId;
            if (!dronId) {
              return; // nothing to do on empty cell
            }
            const equipoCelda = celda.dataset.dronEquipo;
            const miEquipo = getSessionValue('equipoAsignado');
            if (equipoCelda && miEquipo && equipoCelda !== miEquipo) {
              return;
            }
            const playerIdCelda = getPlayerIdActual();
            if (!playerIdCelda) {
              // TODO el playerId debería guardarse al hacer join inicial
              alert('Jugador no identificado');
              return;
            }
            try {
              const data = await apiRequest(
                `/selectDrone2?playerId=${encodeURIComponent(playerIdCelda)}&dronId=${encodeURIComponent(dronId)}`,
                'POST'
              );
              if (data.ok) {
                // visualizar selección y guardar estado
                document.querySelectorAll('.celda.seleccionado').forEach(el => el.classList.remove('seleccionado'));
                celda.classList.add('seleccionado');
                // actualizar variable global
                selectedDron = {
                  id: dronId,
                  fila: parseInt(celda.dataset.fila),
                  col: parseInt(celda.dataset.col),
                  cell: celda,
                  tipo: celda.dataset.dronTipo || null // <-- AGREGAR
                };
                // activar botón mover y cancelar cualquier modo previo
                exitMoveMode();
                exitShootMode();
                if (btnMover) {
                  btnMover.disabled = false;
                }
                if (btnDisparar) {
                  btnDisparar.disabled = false;
                }
              } else {
                alert('No se pudo seleccionar el dron: ' + (data.estado || 'ERROR'));
              }
            } catch (err) {
              alert('Error al seleccionar dron: ' + (err?.message || 'ERROR'));
            }
          });
          
          grid.appendChild(celda);
          celdas.push({ celda, fila: f, col: c });
        }
      }

      console.log('Cuadrícula creada:', filasTotal, 'filas x', colsTotal, 'columnas =', celdas.length, 'celdas');

      const equipoAsignado = getSessionValue('equipoAsignado') || 'NAVAL';
      const estrategiaGuardada = getSessionValue('estrategiaSeleccionada');
      const estrategiaSeleccionada = estrategiaValidaParaEquipo(estrategiaGuardada, equipoAsignado)
        ? estrategiaGuardada
        : estrategiaDefaultPorEquipo(equipoAsignado);

      setSessionValue('estrategiaSeleccionada', estrategiaSeleccionada);
      console.log('Estrategia seleccionada:', estrategiaSeleccionada);

      try {
        const plantilla = normalizarTipoPlantilla(estrategiaSeleccionada);
        if (plantilla) {
          const templateResp = await apiRequest(
            `/template?playerId=${encodeURIComponent(playerIdActual)}&plantilla=${encodeURIComponent(plantilla)}`,
            'POST'
          );
          if (templateResp?.ok === false && templateResp?.estado !== 'PLANTILLA_YA_BLOQUEADA') {
            alert(`No se pudo aplicar la plantilla: ${templateResp.estado || 'ERROR'}`);
            return;
          }
        }

        const board = await apiRequest(`/board?playerId=${encodeURIComponent(playerIdActual)}`);
        const formacion = convertirBoardAFormacion(board, equipoAsignado);

        if (!formacion || formacion.puertos.length === 0) {
          alert('Aún no se pudo cargar la plantilla de despliegue.');
          return;
        }

        actualizarRenderPortasDesdeBoard(board);
        actualizarRenderDronesDesdeBoard(board);
        
        console.log('Formación Naval1 renderizada');
      } catch (error) {
        alert(`No se pudo cargar tablero desde backend: ${error.message}`);
      }
    })();

    refreshPartidaState();
    refreshIntervalId = setInterval(refreshPartidaState, 1000);
  </script>

  <!-- Phaser 3 para animaciones laterales -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
  <!-- Sistema de vista lateral de ataques -->
  <script src="/frontend/js/lateral-attack.js"></script>
</body>
